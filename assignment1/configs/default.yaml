seed: 42

data:
  dataset: fashion_mnist   # fashion_mnist = main results; mnist = debugging only
  data_root: data
  val_fraction: 0.1        # 6000 of the 60000 official training images
  stratified: true
  batch_size: 128
  num_workers: 0           # >0 on Windows needs the __main__ guard in scripts/train.py
  augment: false

model:
  name: linear             # linear | mlp | cnn | lstm | gru | transformer
  hidden_sizes: [256]      # MLP only
  channels: [32, 64]       # CNN only: one conv-pool block per entry
  sequence: rows           # LSTM/GRU/Transformer: rows | columns | patches
  patch_size: 7            # only read when sequence: patches
  hidden_size: 128         # LSTM/GRU only
  num_layers: 1            # LSTM/GRU only
  d_model: 128             # Transformer only: token width after projection
  nhead: 4                 # Transformer only: must divide d_model
  encoder_layers: 2        # Transformer only
  dim_feedforward: 256     # Transformer only
  dropout: 0.2             # every model except linear

train:
  epochs: 15
  optimizer: adam          # adam | sgd
  lr: 0.001
  weight_decay: 0.0
  monitor: macro_f1        # checkpoint selection metric on the validation split
  early_stopping_patience: 5
